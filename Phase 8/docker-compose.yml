version: '3.8'

services:
  support-agent-api:
    build: .
    container_name: retailcorp-support-agent
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_NAME=gpt-4o-mini
      - LOG_LEVEL=INFO
    volumes:
      - ./chroma_db_store:/app/chroma_db_store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3